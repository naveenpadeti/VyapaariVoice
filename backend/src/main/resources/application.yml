server:
  port: 8080

spring:
  application:
    name: vaanistock-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

---
# Default development profile using PostgreSQL-compatible in-memory H2
spring:
  config:
    activate:
      on-profile: default
  datasource:
    url: jdbc:h2:mem:vaanistock;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

---
# Production / Docker PostgreSQL profile
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vaanistock}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

---
# Application-specific configuration
vaanistock:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 604800000 # 7 days
  inventory:
    default-coverage-days: 15
    low-stock-ratio-alert: 1.0
  voice:
    default-language: te # English: en, Telugu: te, Hindi: hi
    gemini-api-key: ${AI_API_KEY:}
  demo:
    enabled: true

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
